:root{
  --bg:#0A0A0F;
  --surface:#14141F;
  --surface2:#1C1C2E;
  --line:#2A2A3F;
  --purple:#9333EA;
  --blue:#06B6D4;
  --text:#FFFFFF;
  --muted:#A8A8C0;
  --success:#22C55E;
  --warn:#F59E0B;
  --danger:#EF4444;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0A0A0F;
    --surface:#14141F;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk", "Hind Siliguri", system-ui, sans-serif;
}

.font-bn{
  font-family:"Hind Siliguri", "Space Grotesk", system-ui, sans-serif;
}

.glass{
  background:linear-gradient(135deg, rgba(147,51,234,.18), rgba(6,182,212,.12));
  border:1px solid rgba(147,51,234,.35);
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
}

.btn-primary{
  background:linear-gradient(90deg,#9333EA,#06B6D4);
  color:white;
  font-weight:800;
  border-radius:14px;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 10px 30px rgba(147,51,234,.35);
}

.btn-primary:disabled{
  opacity:.55;
  box-shadow:none;
}

.btn-ghost{
  background:var(--surface2);
  border:1px solid var(--line);
  color:white;
  border-radius:14px;
  padding:11px 14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.input{
  width:100%;
  background:#0F0F1A;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  color:white;
  outline:none;
  font-size:14px;
}

.input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px rgba(147,51,234,.18);
}

.chip{
  border:1px solid var(--line);
  background:#171726;
  color:#D8D8EA;
  border-radius:999px;
  padding:7px 12px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.chip.active{
  background:var(--purple);

  border-color:var(--purple);
}

.progress{
  height:10px;
  background:#26263A;
  border-radius:999px;
  overflow:hidden;
}

.progress > div{
  height:100%;
  background:linear-gradient(90deg,#9333EA,#06B6D4);
  border-radius:999px;
  transition:width .4s;
}

.scrollbar::-webkit-scrollbar{
  height:6px;
  width:6px;
}

.scrollbar::-webkit-scrollbar-thumb{
  background:#33334D;
  border-radius:99px;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes splashPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 45px rgba(147,51,234,.75),0 0 90px rgba(6,182,212,.45)
  }

  50%{
    transform:scale(1.06);
    box-shadow:0 0 70px rgba(147,51,234,.95),0 0 130px rgba(6,182,212,.65)
  }
}

@keyframes splashShimmer{
  0%{
    background-position:0% 50%
  }

  100%{
    background-position:200% 50%
  }
}

@keyframes splashFloat{
  0%,100%{
    transform:translateY(0) rotate(-6deg)
  }

  50%{
    transform:translateY(-16px) rotate(6deg)
  }
}

@keyframes splashFloat2{
  0%,100%{
    transform:translateY(0) rotate(5deg)
  }

  50%{
    transform:translateY(14px) rotate(-7deg)
  }
}

@keyframes splashBolt{
  0%,100%{
    transform:scale(1) rotate(-4deg);
    filter:drop-shadow(0 0 6px rgba(255,255,255,.9))
  }

  50%{
    transform:scale(1.18) rotate(4deg);
    filter:drop-shadow(0 0 16px rgba(255,255,255,1))
  }
}

@keyframes splashFlash{
  0%,88%,100%{
    opacity:0
  }

  90%,94%{
    opacity:.55
  }

  92%{
    opacity:.18
  }
}

@keyframes splashParticle{
  0%{
    transform:translateY(0) scale(1);
    opacity:0
  }

  12%{
    opacity:.95
  }

  100%{
    transform:translateY(-120px) scale(.35);
    opacity:0
  }
}

@keyframes splashSpin{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

@keyframes splashSpinRev{
  from{
    transform:rotate(360deg)
  }

  to{
    transform:rotate(0deg)
  }
}

@keyframes splashSlowPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 42px rgba(147,51,234,.65),0 0 84px rgba(6,182,212,.4)
  }

  50%{
    transform:scale(1.09);
    box-shadow:0 0 72px rgba(147,51,234,.95),0 0 132px rgba(6,182,212,.65)
  }
}

@keyframes splashFadeOut{
  from{
    opacity:1;
    transform:scale(1)
  }

  to{
    opacity:0;
    transform:scale(1.04)
  }
}

@keyframes splashRise{
  from{
    opacity:0;
    transform:translateY(18px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.splash-pulse{
  animation:splashPulse 1.6s ease-in-out infinite;
}

.splash-slow-pulse{
  animation:splashSlowPulse 2.8s ease-in-out infinite;
}

.splash-ring{
  animation:splashSpin 8s linear infinite;
  box-shadow:0 0 26px rgba(6,182,212,.25);
}

.splash-ring-rev{
  animation:splashSpinRev 6s linear infinite;
}

.splash-shimmer{
  background-size:200% auto;
  animation:splashShimmer 2.2s linear infinite;
}

.splash-bolt{
  animation:splashBolt 1.1s ease-in-out infinite;
}

.splash-flash{
  animation:splashFlash 2.4s linear infinite;
}

.splash-fade-out{
  animation:splashFadeOut .55s ease both;
}

.splash-rise{
  animation:splashRise .6s ease both;
}

.splash-float{
  animation:splashFloat 3.2s ease-in-out infinite;
}

.splash-float-2{
  animation:splashFloat2 3.8s ease-in-out infinite;
}

@keyframes pulseGlow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(239,68,68,.35)
  }

  50%{
    box-shadow:0 0 0 8px rgba(239,68,68,0)
  }
}

.live-dot{
  animation:pulseGlow 1.6s infinite;
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.fade-up{
  animation:fadeUp .35s ease both;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

@keyframes drawerIn{
  from{
    transform:translateX(-100%);
  }

  to{
    transform:translateX(0);
  }
}

@keyframes drawerFade{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

.drawer-panel{
  animation:drawerIn .28s cubic-bezier(.22,.9,.3,1) both;
}

.drawer-overlay{
  animation:drawerFade .22s ease both;
}
