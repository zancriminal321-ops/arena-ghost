:root{
  --bg:#08070D;
  --surface:#12101D;
  --surface2:#1A1728;
  --line:#2A2440;
  --primary:#9333EA;
  --secondary:#06B6D4;
  --text:#FFFFFF;
  --muted:#B8B2D1;
  --safe-area-inset-top: var(--safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#08070D;
    --surface:#12101D;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Hind Siliguri','Space Grotesk',system-ui,sans-serif
}

button,input,select,textarea{
  font-family:inherit
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#2A2440;
  border-radius:99px
}

.glass{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08)
}

.glow{
  box-shadow:0 0 0 1px var(--primary),0 18px 50px rgba(147,51,234,.22)
}

.grad{
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%)
}

.grad-text{
  background:linear-gradient(90deg,#C084FC,#22D3EE);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

/* STABILITY FIX: no animation, bounce, float, pulse, shimmer or fade on any card/list.
   Tournament cards, home list and profile timer must stay completely still. */

.anim-up,.nav-shine{
  animation:none !important;
  transform:none !important
}

.nav-active{
  box-shadow:0 10px 28px rgba(147,51,234,.45),0 6px 22px rgba(6,182,212,.28),inset 0 1px 0 rgba(255,255,255,.28)
}

.nav-icon{
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))
}

.nav-badge{
  box-shadow:0 4px 14px rgba(239,68,68,.55),inset 0 1px 0 rgba(255,255,255,.55)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:#9333EA!important;
  box-shadow:0 0 0 3px rgba(147,51,234,.22)
}

/* Stable tournament layout */

.tour-list{
  display:grid;
  gap:12px;
  grid-template-columns:1fr
}

@media(min-width:768px){
  .tour-list{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }
}

.tour-card,.tour-card *{
  animation:none !important;
  transition:none !important
}

.tour-card{
  transform:none !important;
  display:flex;
  flex-direction:column;
  min-height:232px
}

.tour-card:hover{
  transform:none !important;
  box-shadow:none
}

.tour-card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  min-height:52px
}

.tour-title{
  font-weight:700;
  font-size:17px;
  line-height:1.25;
  min-height:44px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere
}

.tour-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.4;
  min-height:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.tour-thumb{
  width:100%;
  height:0;
  min-height:0;
  display:none
}

.tour-badge{
  flex-shrink:0;
  white-space:nowrap
}

.tour-actions{
  margin-top:auto;
  padding-top:16px;
  display:flex;
  gap:8px
}

.tour-actions button{
  transform:none !important
}

.tour-actions button:hover{
  transform:none !important
}

/* Fixed-width digits so a changing countdown / timer never moves neighbours */

.tabular,.profile-timer{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:0
}

.profile-timer{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-width:280px;
  justify-content:center;
  white-space:nowrap
}

@media(max-width:420px){
  .profile-timer{
    min-width:0;
    width:100%
  }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important
  }
}
