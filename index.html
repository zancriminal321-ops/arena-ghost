:root{
  --bg:#08070D;
  --surface:#12101D;
  --surface2:#1A1728;
  --line:#2A2440;
  --primary:#9333EA;
  --secondary:#06B6D4;
  --text:#FFFFFF;
  --muted:#B8B2D1;
  --safe-area-inset-top: var(--safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#08070D;
    --surface:#12101D;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Hind Siliguri','Space Grotesk',system-ui,sans-serif
}

button,input,select,textarea{
  font-family:inherit
}

::-webkit-scrollbar{
  width:8px;
  height:8px
}

::-webkit-scrollbar-thumb{
  background:#2A2440;
  border-radius:99px
}

.glass{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08)
}

.glow{
  box-shadow:0 0 0 1px var(--primary),0 18px 50px rgba(147,51,234,.22)
}

.grad{
  background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%)
}

.grad-text{
  background:linear-gradient(90deg,#C084FC,#22D3EE);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

/* STABILITY FIX: no animation, bounce, float, pulse, shimmer or fade on any card/list.
   Tournament cards, home list and profile timer must stay completely still. */

.anim-up,.nav-shine{
  animation:none !important;
  transform:none !important
}

.nav-active{
  box-shadow:0 10px 28px rgba(147,51,234,.45),0 6px 22px rgba(6,182,212,.28),inset 0 1px 0 rgba(255,255,255,.28)
}

.nav-icon{
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))
}

.nav-badge{
  box-shadow:0 4px 14px rgba(239,68,68,.55),inset 0 1px 0 rgba(255,255,255,.55)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

input,select,textarea{
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:#9333EA!important;
  box-shadow:0 0 0 3px rgba(147,51,234,.22)
}

/* Stable tournament layout */

.tour-list{
   display:grid;
   gap:14px;
   grid-template-columns:1fr !important;
   width:100% !important; }
.sector-title{font-size:18px;font-weight:800;margin-top:18px}
.tour-mode-banner{height:86px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:-4px -4px 10px -4px;background:linear-gradient(135deg,#9333EA,#7C3AED,#06B6D4);border:1px solid rgba(255,255,255,.15);overflow:hidden;position:relative}
.tour-mode-banner span{font-size:28px;line-height:1}
.tour-mode-banner b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.tour-mode-banner small{font-size:11px;color:rgba(255,255,255,.85)}
@media(max-width:380px){.sector-title{font-size:18px;font-weight:800;margin-top:18px}
.tour-mode-banner{height:74px}}
.tour-card{padding:16px!important;min-height:0!important;width:100%!important;max-width:100%!important}

@media(min-width:768px){ .tour-list{ grid-template-columns:1fr !important; } }

.tour-card,.tour-card *{
  animation:none !important;
  transition:none !important
}

.tour-card{
  transform:none !important;
  display:flex;
  flex-direction:column;
  min-height:232px
}

.tour-card:hover{
  transform:none !important;
  box-shadow:none
}

.tour-card-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  min-height:52px
}

.tour-title{
  font-weight:700;
  font-size:17px;
  line-height:1.25;
  min-height:44px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere
}

.tour-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
  line-height:1.4;
  min-height:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.tour-thumb{
  width:100%;
  height:0;
  min-height:0;
  display:none
}

.tour-badge{
  flex-shrink:0;
  white-space:nowrap
}

.tour-actions{
  margin-top:auto;
  padding-top:16px;
  display:flex;
  gap:8px
}

.tour-actions button{
  transform:none !important
}

.tour-actions button:hover{
  transform:none !important
}

/* Fixed-width digits so a changing countdown / timer never moves neighbours */

.tabular,.profile-timer{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
  letter-spacing:0
}

.profile-timer{
  display:inline-flex;

// --- MOBILE DRAWER CLONE - bypasses all clipping, always BIG ---
window.CIRCUIT_openDrawer = function(){
  try{
    let aside=document.querySelector("aside");
    if(!aside) return;
    // If already open, close it
    if(aside.dataset.drawerOpen==="1"){
      aside.dataset.drawerOpen="0";
      let bg=document.getElementById("mobile-drawer-bg"); if(bg) bg.remove();
      // Move back to original parent
      let orig=document.getElementById("sidebar-orig-holder");
      if(orig && orig.parentNode){ orig.parentNode.insertBefore(aside, orig); orig.remove(); }
      aside.style.cssText=""; aside.classList.remove("mobile-open");
      document.body.classList.remove("drawer-open");
      return;
    }
    // Save original place
    let holder=document.createElement("div"); holder.id="sidebar-orig-holder"; holder.style.display="none";
    if(aside.parentNode) aside.parentNode.insertBefore(holder, aside);
    // MOVE aside itself to body (keeps all buttons working)
    document.body.appendChild(aside);
    aside.dataset.drawerOpen="1";
    aside.classList.remove("hidden");
    aside.style.cssText="display:block!important;position:fixed!important;top:0!important;left:0!important;bottom:0!important;right:auto!important;width:100%!important;min-width:0!important;max-width:100%!important;height:100dvh!important;max-height:100dvh!important;overflow-y:auto!important;overflow-x:hidden!important;z-index:99999!important;background:#0F0D1A!important;box-shadow:30px 0 80px rgba(0,0,0,.9)!important;border-right:1px solid rgba(255,255,255,.2)!important;padding:16px!important;padding-top:16px!important;-webkit-overflow-scrolling:touch!important";
    // Backdrop
    let bg=document.createElement("div");
    bg.id="mobile-drawer-bg";
    bg.style.cssText="position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.55)";
    bg.onclick=()=>window.CIRCUIT_openDrawer();
    document.body.appendChild(bg);
    // Make sure backdrop is BEHIND drawer (drawer is 99999, bg 99998, close btn 100000)
  }catch(e){ console.error(e); }
};

<script>
// CIRCUIT - Live 7-day lock countdown - updates every second
(function(){
  function fmt(ms){
    if(ms<=0) return "0s";
    var s=Math.floor(ms/1000);
    var d=Math.floor(s/86400); s%=86400;
    var h=Math.floor(s/3600); s%=3600;
    var m=Math.floor(s/60); var sec=s%60;
    if(d>0) return d+" দিন "+h+" ঘণ্টা "+m+" মিনিট "+sec+" সেকেন্ড";
    if(h>0) return h+" ঘণ্টা "+m+" মিনিট "+sec+" সেকেন্ড";
    if(m>0) return m+" মিনিট "+sec+" সেকেন্ড";
    return sec+" সেকেন্ড";
  }
  function tick(){
    document.querySelectorAll(".circuit-lock-timer").forEach(function(el){
      var until=parseInt(el.getAttribute("data-until")||"0",10);
      var left=until-Date.now();
      var card=el.closest(".circuit-lock-card");
      var btn=card?card.querySelector("button.circuit-change-btn"):null;
      if(left<=0){ el.style.display="none"; if(btn){btn.style.display=""; btn.disabled=false;} return; }
      el.textContent="⏳ "+fmt(left)+" পর Change করতে পারবেন";
      if(btn) btn.style.display="none";
    });
  }
  setInterval(tick,1000); setTimeout(tick,500);
})();
</script>

  function reallyAtTop(target){
    if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) return false;
    var n = target;
