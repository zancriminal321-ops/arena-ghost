:root{
  --bg:#0a0a0a;
  --surface:#141414;
  --surface2:#1d1d1d;
  --surface3:#262626;
  --line:#2b2b2b;
  --text:#ffffff;
  --muted:#a8a8a8;
  --muted2:#777777;
  --accent:#ff6b00;
  --accent2:#ffb300;
  --green:#22c55e;
  --red:#ff3b30;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0a0a;
    --surface:#141414;
  }
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:#0a0a0a;
  color:var(--text);
  font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
}

body{
  overflow-x:clip;
}

.font-bangla{
  font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

.no-scrollbar{
  scrollbar-width:none;
}

.app-scroll::-webkit-scrollbar{
  width:4px;
}

.app-scroll::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:99px;
}

@keyframes pop{
  from{
    transform:translateY(8px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

.animate-pop{
  animation:pop .28s ease both;
}

@keyframes pulse-dot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.5);
    opacity:.6
  }
}

.live-dot{
  animation:pulse-dot 1.4s infinite;
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-4px)
  }
}

.floaty{
  animation:floaty 3s ease-in-out infinite;
}

@keyframes splash-scale-in{
  from{
    transform:scale(.72);
    opacity:0
  }

  60%{
    transform:scale(1.04);
    opacity:1
  }

  to{
    transform:scale(1);
    opacity:1
  }
}

@keyframes splash-glow-pulse{
  0%,100%{
    box-shadow:0 0 0 rgba(255,107,0,.35), 0 18px 44px rgba(255,107,0,.28);
    transform:scale(1)
  }

  50%{
    box-shadow:0 0 52px rgba(255,107,0,.65), 0 18px 54px rgba(255,107,0,.42);
    transform:scale(1.05)
  }
}

@keyframes splash-fade-in{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes splash-dot{
  0%,80%,100%{
    transform:translateY(0);
    opacity:.35
  }

  40%{
    transform:translateY(-5px);
    opacity:1
  }
}

.splash-logo{
  animation:splash-scale-in .6s cubic-bezier(.2,.9,.3,1.2) both, splash-glow-pulse 1.6s ease-in-out .6s infinite;
}

.splash-fade-in{
  animation:splash-fade-in .6s ease .15s both;
}

.splash-fade-in-late{
  animation:splash-fade-in .6s ease .35s both;
}

.splash-dot{
  animation:splash-dot 1.1s ease-in-out infinite;
}

.splash-dot:nth-child(2){
  animation-delay:.15s;
}

.splash-dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes splash-logo-pulse{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.12);
    opacity:.85
  }
}

.splash-logo-pulse{
  animation:splash-logo-pulse 1.1s ease-in-out infinite;
}

/* --- Post-login success animation --- */

@keyframes login-glow{
  0%,100%{
    opacity:.55;
    transform:scale(1)
  }

  50%{
    opacity:1;
    transform:scale(1.12)
  }
}

@keyframes login-icon{
  0%{
    transform:scale(.25) translateY(28px) rotate(-8deg);
    opacity:0
  }

  38%{
    transform:scale(1.18) translateY(-14px) rotate(3deg);
    opacity:1
  }

  58%{
    transform:scale(.94) translateY(4px) rotate(-2deg)
  }

  76%{
    transform:scale(1.06) translateY(-7px)
  }

  100%{
    transform:scale(1) translateY(0)
  }
}

@keyframes login-bounce-soft{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-10px)
  }
}

@keyframes login-ring{
  0%{
    transform:translate(-50%,-50%) scale(.25);
    opacity:.9
  }

  100%{
    transform:translate(-50%,-50%) scale(2.6);
    opacity:0
  }
}

@keyframes login-confetti{
  0%{
    transform:translate3d(0,-8vh,0) rotate(0deg);
    opacity:0
  }

  8%{
    opacity:1
  }

  100%{
    transform:translate3d(var(--drift,18px),108vh,0) rotate(620deg);
    opacity:.95
  }
}

@keyframes login-fade-up{
  from{
    opacity:0;
    transform:translateY(16px) scale(.96)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

@keyframes login-zoom-out{
  from{
    opacity:1;
    transform:scale(1)
  }

  to{
    opacity:0;
    transform:scale(1.22)
  }
}

@keyframes login-bar{
  from{
    width:4%
  }

  to{
    width:100%
  }
}

@keyframes login-sparkle{
  0%,100%{
    transform:scale(.6) rotate(0deg);
    opacity:.35
  }

  50%{
    transform:scale(1.25) rotate(45deg);
    opacity:1
  }
}

@keyframes login-dot{
  0%,80%,100%{
    transform:translateY(0);
    opacity:.35
  }

  40%{
    transform:translateY(-6px);
    opacity:1
  }
}

.login-intro{
  animation:login-fade-up .35s ease both;
}

.login-intro-leaving{
  animation:login-zoom-out .42s ease-in both;
}

.login-glow{
  animation:login-glow 1.8s ease-in-out infinite;
}

.login-icon{
  animation:login-icon .95s cubic-bezier(.2,.9,.3,1.25) both, login-bounce-soft 1.15s ease-in-out .95s infinite;
  filter:drop-shadow(0 0 28px rgba(255,107,0,.85)) drop-shadow(0 14px 30px rgba(0,0,0,.6));
}

.login-ring{
  animation:login-ring 1.45s cubic-bezier(.2,.7,.3,1) both;
}

.login-ring-2{
  animation:login-ring 1.45s cubic-bezier(.2,.7,.3,1) .35s both;
}

.login-confetti{
  animation:login-confetti var(--fall,2.4s) linear var(--delay,0s) infinite;
}

.login-fade-1{
  animation:login-fade-up .5s ease .18s both;
}

.login-fade-2{
  animation:login-fade-up .5s ease .34s both;
}

.login-fade-3{
  animation:login-fade-up .5s ease .5s both;
}

.login-fade-4{
  animation:login-fade-up .5s ease .66s both;
}

.login-bar{
  animation:login-bar 2.1s ease .15s both;
}

.login-sparkle{
  animation:login-sparkle 1.2s ease-in-out infinite;
}

.login-dot{
  animation:login-dot 1.1s ease-in-out infinite;
}

.login-dot:nth-child(2){
  animation-delay:.15s;
}

.login-dot:nth-child(3){
  animation-delay:.3s;
}

/* --- Offline / No Internet screen --- */

@keyframes offline-pulse{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.08);
    opacity:.82
  }
}

@keyframes offline-float{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-10px) rotate(2deg)
  }
}

@keyframes offline-shake{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-9px)
  }

  40%{
    transform:translateX(8px)
  }

  60%{
    transform:translateX(-6px)
  }

  80%{
    transform:translateX(5px)
  }
}

@keyframes offline-ring{
  0%{
    transform:scale(.7);
    opacity:.8
  }

  100%{
    transform:scale(1.9);
    opacity:0
  }
}

.offline-pulse{
  animation:offline-pulse 1.6s ease-in-out infinite;
}

.offline-float{
  animation:offline-float 2.6s ease-in-out infinite;
}

.offline-shake{
  animation:offline-shake .45s ease-in-out;
}

.offline-ring{
  animation:offline-ring 1.8s ease-out infinite;
}

.offline-ring-2{
  animation:offline-ring 1.8s ease-out .6s infinite;
}
